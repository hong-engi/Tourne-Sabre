<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>스킬·증강 피드백</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f1d1a;--sub:#6b665e;--line:#e3e0da;--acc:#2f5fd0;--stage:#1d2129}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--card:#211f25;--ink:#ece9e4;--sub:#a29d95;--line:#35323a;--acc:#7fa2ff;--stage:#121418}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}input,select,textarea,button{font:inherit;color:inherit}
input[type=search],select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#count{color:var(--sub);margin-left:auto}main{max-width:1040px;margin:0 auto;padding:16px 20px 80px}
h2{font-size:15px;color:var(--sub);margin:28px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:14px}
.card.done{border-left:4px solid var(--acc)}
canvas{flex:none;width:220px;height:165px;border-radius:8px;background:var(--stage)}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.name{font-weight:600}.meta{color:var(--sub);font-size:13px}
.note{color:var(--sub);font-size:12px}
.desc{margin:4px 0 8px}.row{display:flex;gap:6px;align-items:flex-start;margin-top:auto}
textarea{flex:1;min-height:52px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;resize:vertical}
.save{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.status{font-size:12px;color:var(--sub);min-width:52px}
@media (max-width:640px){.card{flex-direction:column}canvas{width:100%;height:auto;aspect-ratio:4/3}}
</style></head><body>
<header><h1>스킬·증강 피드백</h1>
<input type="search" id="q" placeholder="이름·설명 검색">
<select id="g"><option value="">전체</option></select>
<select id="f"><option value="">모두</option><option value="todo">미작성</option><option value="done">작성함</option></select>
<span id="count"></span></header>
<main id="list"></main>
<script>
let items=[],fb={};
const $=s=>document.querySelector(s);

// ---------- effect preview ----------
// World units → canvas: the player stands low in the frame facing up.
const W=220,H=165,SC=.24,PX=W/2,PY=H*.74,DEFAULT_LOOP=2600;
const TIER={silver:'#c9d1db',gold:'#f2c14e',prismatic:'#c58cff',transcendent:'#ff7ad9'};
const FOES=[[0,-230],[-110,-170],[105,-300],[-40,-420]];
function timeline(spec){let end=1200;
  (spec.fx||[]).forEach(f=>{end=Math.max(end,(f.delay||0)+(f.ticks?f.ticks*(f.every||500):0)+(f.last||0)+500);});
  if(spec.blades)end=Math.max(end,2600);return Math.min(Math.max(end+600,DEFAULT_LOOP),5200);}
function moveAt(spec,t){ // player offset and where the move started/ended
  const m=spec.move;if(!m)return {x:0,y:0,end:{x:0,y:0}};
  let d=m.dist||160,tx=0,ty=-d;
  if(m.kind==='nearest'){tx=FOES[0][0];ty=FOES[0][1]+(m.stop||70);}
  if(m.kind==='gate')return {x:0,y:0,end:{x:0,y:-m.dist}};
  const k=m.kind==='dash'?Math.min(1,t/(m.ms||180)):(t>0?1:0);
  return {x:tx*k,y:ty*k,end:{x:tx,y:ty}};}
function anchorPos(f,me,end,face){
  if(f.at==='origin')return {x:0,y:0};
  if(f.at==='dest')return end;
  if(f.at==='nearest')return {x:FOES[0][0],y:FOES[0][1]};
  if(f.at==='point'||f.at==='front')return {x:me.x,y:me.y-(f.off||f.len||250)};
  return me;}
function draw(ctx,item,now){
  const spec=item.fx||{generic:true,fx:[]};const loop=item._loop||(item._loop=timeline(spec));
  const t=(now%loop)-300;const accent=TIER[item.tier]||'#7fb2ff';
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W*2,H*2);ctx.setTransform(2,0,0,2,0,0);
  const P=(x,y)=>[PX+x*SC,PY+y*SC];
  // grid
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;for(let x=0;x<W;x+=22){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  const mv=moveAt(spec,Math.max(t,-1));const me={x:mv.x,y:mv.y};
  // zones / statuses
  let flash=0,slow=false;
  (spec.fx||[]).forEach(f=>{
    const c=anchorPos(f,me,mv.end);const st=f.delay||0;
    if(f.t!=='hit'){drawAux(ctx,f,t,P,me,accent);return;}
    const live=(f.ticks?f.ticks*(f.every||500):0)+(f.last||0)+650;
    const warn=t>=0&&t<st&&(f.warn||st>=300);const on=t>=st&&t<st+live;
    if(!warn&&!on)return;
    const fade=on?1-Math.min(1,(t-st)/live)*.7:.5;
    if(on&&t-st<200)flash=Math.max(flash,1-(t-st)/200);
    if(on&&f.status&&f.status.slow||f.status&&f.status.root)slow=slow||on;
    const col=f.status&&(f.status.slow||f.status.root)&&!f.power?'120,200,255':f.status&&f.status.burn?'255,140,60':f.status&&f.status.bleed?'230,60,80':'255,235,170';
    ctx.save();const [cx,cy]=P(c.x,c.y);ctx.translate(cx,cy);
    const ang=(f.angle||0);ctx.rotate(ang);if(f.side)ctx.translate(f.side*SC,0);
    ctx.beginPath();
    if(f.shape==='circle'){ctx.arc(0,0,(f.r||100)*SC,0,7);if(f.ring){ctx.arc(0,0,Math.max(0,(f.r-f.ring))*SC,0,7,true);}}
    else if(f.shape==='cone'){const s=(f.spread||1.6)/2;ctx.moveTo(0,0);ctx.arc(0,0,(f.len||200)*SC,-Math.PI/2-s,-Math.PI/2+s);ctx.closePath();}
    else {const w=(f.w||50)*SC,l=(f.len||250)*SC;ctx.rect(-w/2,-l,w,l);}
    if(warn){ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(255,90,90,.85)';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='rgba(255,60,60,.12)';ctx.fill('evenodd');}
    else{ctx.fillStyle=`rgba(${col},${.42*fade})`;ctx.fill('evenodd');ctx.strokeStyle=`rgba(${col},${.9*fade})`;ctx.lineWidth=1.2;ctx.stroke();}
    ctx.restore();});
  // gate portals / turret / decoy markers
  if(spec.move&&spec.move.kind==='gate'&&t>=0){[[0,0],[0,-spec.move.dist]].forEach(([x,y])=>{const [a,b]=P(x,y);ctx.strokeStyle='#9ef';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(a,b,9,13,0,0,7);ctx.stroke();});}
  if((spec.move&&spec.move.kind==='turret'||spec.turret)){const [a,b]=P(spec.turret?0:0,spec.turret?-160:-(spec.move.dist||160));drawSword(ctx,a,b,now/220,.75,'rgba(180,220,255,.8)');ctx.fillStyle='#8ab';ctx.fillRect(a-5,b-5,10,10);}
  // enemies
  FOES.forEach(([x,y])=>{const [a,b]=P(x,y);ctx.fillStyle=flash>0?`rgb(255,${255-120*flash},${255-160*flash})`:slow?'#7ab8e8':'#c4545b';ctx.beginPath();ctx.arc(a,b,5.5,0,7);ctx.fill();});
  // player and sword
  const [px,py]=P(me.x,me.y);
  if(spec.move&&spec.move.kind==='blink'&&t>=0&&t<350){const [ox,oy]=P(0,0);ctx.strokeStyle='rgba(160,220,255,'+(1-t/350)+')';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(px,py);ctx.stroke();ctx.setLineDash([]);}
  const active=(arr)=>arr&&t>=0&&t<arr[1];
  let spin=1,len=1;if(active(spec.spin))spin=spec.spin[0];if(active(spec.length))len=spec.length[0];
  item._a=(item._a||0)+.06*spin;const phase=spec.phase&&t>=0&&t<spec.phase;
  ctx.globalAlpha=phase?.45:1;
  const swordCol=spec.fire&&t>=0&&t<2500?'#ff9a3c':item.fx?'#e9eef7':accent;
  drawSword(ctx,px,py,item._a,len,swordCol);
  if(spec.twin&&t>=0&&t<3000)drawSword(ctx,px,py,item._a+Math.PI,1,'#bcd');
  ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(px,py,25*SC,0,7);ctx.fill();ctx.globalAlpha=1;
  if(spec.blades&&t>=0&&t<Math.min(spec.blades.ms||3000,3000)){const n=spec.blades.count||3,r=(spec.blades.r||180)*SC;
    for(let i=0;i<n;i++){const a=now/600*(spec.blades.speed||1.5)+i*Math.PI*2/n;drawSword(ctx,px+Math.cos(a)*r,py+Math.sin(a)*r,a+Math.PI/2,.45,'#bfe');}}
  if(spec.generic){ // shared augments: sword + tier glow on hits
    const pulse=(Math.sin(now/260)+1)/2;ctx.strokeStyle=accent;ctx.globalAlpha=.25+.35*pulse;ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,(25+110)*SC,0,7);ctx.stroke();ctx.globalAlpha=1;}
  // cast tick
  if(t>=0&&t<180){ctx.strokeStyle='rgba(255,255,255,'+(1-t/180)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,(25+t/3)*SC*2,0,7);ctx.stroke();}
}
function drawSword(ctx,x,y,a,len,col){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-25*SC);ctx.lineTo(0,-(25+100*len)*SC);ctx.stroke();ctx.restore();}
function drawAux(ctx,f,t,P,me,accent){
  if(t<0)return;const ms=f.ms||(f.ticks?f.ticks*1000:1500);if(t>Math.min(ms,3000)&&!['heal','cost'].includes(f.t))return;
  const [x,y]=P(me.x,me.y);ctx.save();
  const ring=(r,col,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=2;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.setLineDash([]);};
  const k=(Date.now()%900)/900;
  switch(f.t){
    case 'shield':ring(11,'rgba(120,190,255,.95)');ctx.fillStyle='rgba(120,190,255,.18)';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();break;
    case 'guard':case 'parry':case 'record':case 'undying':case 'anchor':ring(10,f.t==='parry'?'#fff2a8':f.t==='undying'?'#ff9b9b':'#f2c14e',f.t==='anchor'?[3,2]:null);break;
    case 'heal':case 'hot':if(t<1400){ctx.fillStyle='rgba(120,230,140,'+(1-t/1400)+')';ctx.font='bold 13px sans-serif';ctx.fillText('+',x+8,y-6-t/60);ctx.fillText('+',x-14,y-2-t/80);}break;
    case 'cost':if(t<700){ctx.fillStyle='rgba(230,60,80,'+(1-t/700)+')';ctx.font='bold 12px sans-serif';ctx.fillText('−',x+8,y-4-t/50);}break;
    case 'buff':ring(9+k*4,'rgba(255,110,90,'+(1-k)+')');break;
    case 'shots':ring((f.r||120)*.24,'rgba(180,220,255,.7)',[2,3]);break;
    case 'sanctum':case 'banner':{ctx.fillStyle=f.t==='banner'?'rgba(255,200,90,.15)':'rgba(140,240,170,.15)';ctx.beginPath();ctx.arc(x,y,(f.r||160)*.24,0,7);ctx.fill();break;}
    case 'wall':{const [wx,wy]=P(me.x,me.y-120);ctx.strokeStyle='#cfd8e6';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wx-(f.len||220)*.12,wy);ctx.lineTo(wx+(f.len||220)*.12,wy);ctx.stroke();break;}
    case 'decoy':{const [dx,dy]=P(me.x,me.y-160);ctx.globalAlpha=.55;ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(dx,dy,6,0,7);ctx.fill();break;}
    case 'trail':{ctx.fillStyle='rgba(200,230,255,.25)';ctx.fillRect(x-3,y,6,40);break;}
    case 'beat':ring(8+k*6,'rgba(255,255,255,'+(1-k)+')');break;
  }
  ctx.restore();}

// one animation loop, only for cards on screen
const visible=new Set();
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?visible.add(e.target):visible.delete(e.target)));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now){visible.forEach(cv=>draw(cv._ctx,cv._item,reduce?900:now));if(!reduce)requestAnimationFrame(frame);}

// ---------- list ----------
async function load(){const r=await (await fetch('/api/items')).json();items=r.items;fb=r.feedback;
  [...new Set(items.map(i=>i.group))].forEach(g=>$('#g').add(new Option(g,g)));render();requestAnimationFrame(frame);}
async function save(id,card){const text=card.querySelector('textarea').value.trim();
  const st=card.querySelector('.status');st.textContent='저장 중…';
  const res=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,text})});
  if(res.ok){if(text)fb[id]={text};else delete fb[id];card.classList.toggle('done',!!fb[id]);st.textContent='저장됨';count();}
  else st.textContent='실패';}
function count(){$('#count').textContent=`작성 ${Object.keys(fb).filter(k=>items.some(i=>i.id===k)).length} / ${items.length}`;}
function render(){const q=$('#q').value.trim(),g=$('#g').value,f=$('#f').value;const box=$('#list');
  visible.forEach(cv=>io.unobserve(cv));visible.clear();box.innerHTML='';let last='';
  items.filter(i=>(!g||i.group===g)&&(!q||(i.name+i.description+i.id).includes(q))&&(!f||(f==='done')===!!fb[i.id])).forEach(i=>{
    if(i.group!==last){const h=document.createElement('h2');h.textContent=i.group;box.append(h);last=i.group;}
    const c=document.createElement('div');c.className='card'+(fb[i.id]?' done':'');const cur=fb[i.id]||{};
    c.innerHTML=`<canvas width="${W*2}" height="${H*2}"></canvas><div class="body"><div class="top"><span class="name"></span><span class="meta"></span></div>
      <div class="desc"></div><div class="note"></div>
      <div class="row"><textarea placeholder="피드백 (⌘/Ctrl+Enter 저장)"></textarea><button class="save">저장</button><span class="status"></span></div></div>`;
    c.querySelector('.name').textContent=i.name;c.querySelector('.meta').textContent=`${i.id}${i.meta?' · '+i.meta:''}`;
    c.querySelector('.desc').textContent=i.description;
    c.querySelector('.note').textContent=i.kind==='증강'?(i.fx?'미리보기: 필요 스킬에 이 증강을 붙인 모습':'미리보기: 공용 효과라 기본 검 회전만 보여 줌'):'';
    const cv=c.querySelector('canvas');cv._ctx=cv.getContext('2d');cv._item=i;io.observe(cv);
    const ta=c.querySelector('textarea');ta.value=cur.text||'';
    c.querySelector('.save').onclick=()=>save(i.id,c);
    ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))save(i.id,c);};
    ta.oninput=()=>c.querySelector('.status').textContent='미저장';
    box.append(c);});count();}
['#q','#g','#f'].forEach(s=>$(s).addEventListener('input',render));load();
</script></body></html>
